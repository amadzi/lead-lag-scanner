[project]
name = "lead-lag-scanner"
version = "0.1.0"
description = "Discover lead/follower exchange pairs in crypto spot markets via cross-correlation of tick-level trade data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "lead-lag-scanner contributors" }]
dependencies = [
    "ccxt>=4.4.0",
    "click>=8.1.7",
    "duckdb>=1.1.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "pyyaml>=6.0.2",
    "rich>=13.7.0",
    "scipy>=1.13.0",
    "structlog>=24.4.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.9.0", "seaborn>=0.13.0"]
ws = ["ccxt[pro]>=4.4.0"]

[project.scripts]
lead-lag-scanner = "lead_lag_scanner.cli:cli"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_lag_scanner"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "TID", # tidy imports
    "PL",  # pylint
    "PT",  # pytest
]
ignore = [
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
    "E501",    # line too long handled by formatter
    "RUF001",  # ambiguous unicode characters (we use math notation: x, sigma, minus)
    "RUF002",  # same in docstrings
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.11"
include = ["src", "tests"]
typeCheckingMode = "basic"
reportMissingImports = "error"
reportMissingTypeStubs = "none"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "pyright>=1.1.380",
]
