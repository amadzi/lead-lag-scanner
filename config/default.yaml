collector:
  # How long (in seconds) `collect` should record before exiting.
  duration: 3600
  # Per-exchange request rate-limit safety factor (1.0 = honour ccxt default,
  # 1.5 = wait 50% longer between requests).
  rate_limit_safety: 1.2
  # If true, prefer ccxt.pro websocket `watchTrades`; otherwise REST polling.
  # Highly recommended when collecting >10 symbols across many exchanges:
  # REST polling at 1s × 51 exchanges × 30 symbols can hit rate limits.
  # Install with `uv sync --extra ws`.
  prefer_websocket: true
  # REST polling interval in seconds (only used when websocket is unavailable).
  # Bumped to 2s by default so REST-only mode stays under per-exchange limits
  # when the symbol list is large.
  rest_poll_interval: 2.0

storage:
  # Where to persist collected trades. Both relative and absolute paths work.
  data_dir: data
  # DuckDB file for ad-hoc queries (also rebuilt from parquet on demand).
  duckdb_path: data/trades.duckdb

analyzer:
  # Resampling grid for last-trade prices (in seconds). 1.0 is a sensible
  # default for spot-vs-spot crypto.
  resample_seconds: 1.0
  # Lag grid `numpy.arange(start, stop + step, step)` in seconds.
  lag_grid:
    start: -5.0
    stop: 5.0
    step: 0.1
  # Minimum *co-active* observations (bars where both sides had a real trade)
  # required before reporting a pair. With `active_mask: true` this is the
  # stricter criterion that protects against spurious lag from forward-fill.
  min_obs: 600
  # Block-bootstrap parameters for confidence interval on the maximum lag.
  bootstrap:
    block_size: 30
    n_iter: 200

  # ── Data-quality fixes ──────────────────────────────────────────────────
  # See `AnalyzerConfig` docstring in src/lead_lag_scanner/config.py for the
  # full rationale. Setting any of these to `false` (or 0) reverts to the
  # legacy behaviour, which is useful for sanity-checking the impact of
  # each fix independently.

  # Re-center each exchange's `timestamp_ms` by subtracting the per-exchange
  # median of `local_recv_ts_ns - exchange_ts_ms` from the cross-exchange
  # consensus median. Removes systematic clock differences between exchange
  # matching engines (often ±100-500 ms, sometimes seconds).
  clock_skew_calibration: true
  # Trades whose `|local_recv_ts_ns/1e6 - exchange_ts_ms|` exceeds this many
  # seconds are excluded from clock-skew calibration. The collector also
  # drops them at ingest. Generous default catches API quirks (microseconds
  # in a millisecond field) without rejecting NTP-loose exchanges.
  max_clock_drift_seconds: 3600.0
  # Restrict the cross-correlation to bars where *both* sides actually saw
  # a trade in the bar (not forward-filled). The single most important fix
  # against false lead-lag from low-tick exchanges.
  active_mask: true
  # Minimum fraction of overlapping bars in which an (exchange, symbol)
  # must have a real (non-forward-filled) trade. Pairs below this on
  # either side are dropped before correlation.
  min_active_rate: 0.05

report:
  # Round-trip taker fee assumption used when computing the edge_bps proxy.
  taker_bps: 10.0
  # Round-trip half-spread paid on entry+exit, in basis points. The default
  # of 4.0 is deliberately optimistic for tier-1 venues and pessimistic for
  # microcaps — tune it to your actual venue mix. Used in `net_edge_bps`
  # and `tradeability` to surface a realistic net-of-cost number alongside
  # the naive `edge_bps` proxy.
  spread_bps: 4.0
  # Round-trip slippage / market-impact assumption, in basis points. Covers
  # adverse selection on entry and exit beyond the quoted spread. Tune this
  # against post-trade analytics for your venue + size.
  slippage_bps: 2.0
  # Output paths (relative to the repo root).
  markdown_path: reports/report.md
  json_path: reports/leaders.json
  # Drop pairs whose absolute correlation is below this threshold.
  min_abs_correlation: 0.4

dashboard:
  # Live terminal dashboard (`lead-lag-scanner dashboard`). Defaults are
  # *looser* than `analyzer.min_obs` and `report.min_abs_correlation` so the
  # dashboard surfaces preliminary signal a few minutes after collection
  # starts. Use `--strict` (or override here) to apply report-grade thresholds.
  refresh_seconds: 30
  top_k: 30
  # One of: tradeability, edge_bps, net_edge_bps, abs_corr, n_obs, lag_abs.
  # `tradeability` is the composite ranking metric (see ReportConfig docstring).
  sort_by: tradeability
  min_abs_correlation: 0.3
  min_obs: 60
  bootstrap_n_iter: 30
  # If true, hide pairs with leader == "none" (zero-lag, no directional edge).
  only_directional: false
  # Sanity flags to suppress in the dashboard. `boundary_lag` (lag pinned to
  # the grid edge) and `wide_ci` (CI spans both signs or covers >50% of grid)
  # almost always indicate an unstable estimate, so they're hidden by default.
  # Other valid flags: `low_n_high_corr`, `zero_lag`. Use `[]` to show all.
  hide_flags:
    - boundary_lag
    - wide_ci
