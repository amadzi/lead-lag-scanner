# Default configuration for lead-lag-scanner.
# Copy this file and pass --config <path> to override any field.

exchanges:
  # ccxt ids; only public endpoints are used. The collector silently skips
  # (exchange, symbol) pairs whose market is not listed, and exchanges that
  # fail to instantiate / load_markets (geo-blocks, dead APIs) are caught,
  # logged, and skipped. Listing 50 exchanges where 10 are blocked from your
  # IP is safe: only viable pairs reach the analyzer, and the analyzer drops
  # anything below `analyzer.min_obs` / `report.min_abs_correlation`. So:
  # more exchanges = more chances to find lead-lag, no downside on output.
  #
  # Generated by probing every ccxt async exchange for BTC/USDT + fetchTrades
  # (see SUPPORTED_EXCHANGES in src/lead_lag_scanner/exchanges.py for notes).
  #
  # Tier 1 - top-volume CEX
  - binance
  - okx
  - bybit
  - kucoin
  - gate
  - mexc
  - bitget
  - htx
  - coinbase
  - kraken
  # Tier 2 - solid USDT liquidity
  - ascendex
  - binanceus
  - bingx
  - bitfinex
  - bitmart
  - bitrue
  - bitstamp
  - bullish
  - cex
  - coinex
  - cryptocom
  - deepcoin
  - digifinex
  - exmo
  - fmfwio
  - gemini
  - hashkey
  - hitbtc
  - lbank
  - phemex
  - poloniex
  - toobit
  - upbit
  - weex
  - whitebit
  - woo
  # Tier 3 - smaller / regional CEX with BTC/USDT spot
  - arkham
  - bequant
  - bigone
  - bitopro
  - bitso
  - btcturk
  - coinmetro
  - coinsph
  - foxbit
  - hollaex
  - indodax
  - latoken
  - luno
  - novadax
  - zebpay

symbols:
  # Must be expressible on every exchange in the list above. The collector will
  # skip any (exchange, symbol) pair where the market does not exist.
  - BTC/USDT
  - ETH/USDT
  - SOL/USDT

collector:
  # How long (in seconds) `collect` should record before exiting.
  duration: 3600
  # Per-exchange request rate-limit safety factor (1.0 = honour ccxt default,
  # 1.5 = wait 50% longer between requests).
  rate_limit_safety: 1.2
  # If true, prefer ccxt.pro websocket `watchTrades`; otherwise REST polling.
  prefer_websocket: true
  # REST polling interval in seconds (only used when websocket is unavailable).
  rest_poll_interval: 1.0

storage:
  # Where to persist collected trades. Both relative and absolute paths work.
  data_dir: data
  # DuckDB file for ad-hoc queries (also rebuilt from parquet on demand).
  duckdb_path: data/trades.duckdb

analyzer:
  # Resampling grid for last-trade prices (in seconds). 1.0 is a sensible
  # default for spot-vs-spot crypto.
  resample_seconds: 1.0
  # Lag grid `numpy.arange(start, stop + step, step)` in seconds.
  lag_grid:
    start: -5.0
    stop: 5.0
    step: 0.1
  # Minimum overlapping seconds required before reporting a pair.
  min_obs: 600
  # Block-bootstrap parameters for confidence interval on the maximum lag.
  bootstrap:
    block_size: 30
    n_iter: 200

report:
  # Round-trip taker fee assumption used when computing the edge_bps proxy.
  taker_bps: 10.0
  # Output paths (relative to the repo root).
  markdown_path: reports/report.md
  json_path: reports/leaders.json
  # Drop pairs whose absolute correlation is below this threshold.
  min_abs_correlation: 0.4
