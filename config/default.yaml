# Default configuration for lead-lag-scanner.
# Copy this file and pass --config <path> to override any field.

exchanges:
  # ccxt ids; only public endpoints are used. The collector silently skips
  # (exchange, symbol) pairs whose market is not listed, and exchanges that
  # fail to instantiate / load_markets (geo-blocks, dead APIs) are caught,
  # logged, and skipped. Listing 50 exchanges where 10 are blocked from your
  # IP is safe: only viable pairs reach the analyzer, and the analyzer drops
  # anything below `analyzer.min_obs` / `report.min_abs_correlation`. So:
  # more exchanges = more chances to find lead-lag, no downside on output.
  #
  # Generated by probing every ccxt async exchange for BTC/USDT + fetchTrades
  # (see SUPPORTED_EXCHANGES in src/lead_lag_scanner/exchanges.py for notes).
  #
  # Tier 1 - top-volume CEX
  - binance
  - okx
  - bybit
  - kucoin
  - gate
  - mexc
  - bitget
  - htx
  - coinbase
  - kraken
  # Tier 2 - solid USDT liquidity
  - ascendex
  - binanceus
  - bingx
  - bitfinex
  - bitmart
  - bitrue
  - bitstamp
  - bullish
  - cex
  - coinex
  - cryptocom
  - deepcoin
  - digifinex
  - exmo
  - fmfwio
  - gemini
  - hashkey
  - hitbtc
  - lbank
  - phemex
  - poloniex
  - toobit
  - upbit
  - weex
  - whitebit
  - woo
  # Tier 3 - smaller / regional CEX with BTC/USDT spot
  - arkham
  - bequant
  - bigone
  - bitopro
  - bitso
  - btcturk
  - coinmetro
  - coinsph
  - foxbit
  - hollaex
  - indodax
  - latoken
  - luno
  - novadax
  - zebpay

symbols:
  # ccxt unified symbols. The collector silently skips (exchange, symbol)
  # pairs whose market is not listed on that exchange, so it is *safe* to
  # add symbols that exist on only some venues. Memecoins / shitcoins were
  # picked by probing ccxt for which USDT-quoted pairs are listed on >=15
  # of the configured exchanges (see scripts/probe-symbols.py if you want
  # to refresh the list).
  #
  # Sanity / volume floor
  - BTC/USDT
  - ETH/USDT
  - SOL/USDT
  # Memecoin majors
  - DOGE/USDT
  - SHIB/USDT
  - PEPE/USDT
  - WIF/USDT
  - BONK/USDT
  - FLOKI/USDT
  # 2024-2025 hot-rotation memes
  - TRUMP/USDT
  - PUMP/USDT
  - VIRTUAL/USDT
  - PNUT/USDT
  - MOODENG/USDT
  - FARTCOIN/USDT
  - POPCAT/USDT
  - BRETT/USDT
  - BOME/USDT
  - TURBO/USDT
  - MEW/USDT
  - GOAT/USDT
  # Volatile alt-L1 / themed picks (often correlated with memes during pumps)
  - SUI/USDT
  - APT/USDT
  - SEI/USDT
  - TIA/USDT
  - INJ/USDT
  - ORDI/USDT
  - WLD/USDT
  - AIXBT/USDT

collector:
  # How long (in seconds) `collect` should record before exiting.
  duration: 3600
  # Per-exchange request rate-limit safety factor (1.0 = honour ccxt default,
  # 1.5 = wait 50% longer between requests).
  rate_limit_safety: 1.2
  # If true, prefer ccxt.pro websocket `watchTrades`; otherwise REST polling.
  # Highly recommended when collecting >10 symbols across many exchanges:
  # REST polling at 1s × 51 exchanges × 30 symbols can hit rate limits.
  # Install with `uv sync --extra ws`.
  prefer_websocket: true
  # REST polling interval in seconds (only used when websocket is unavailable).
  # Bumped to 2s by default so REST-only mode stays under per-exchange limits
  # when the symbol list is large.
  rest_poll_interval: 2.0

storage:
  # Where to persist collected trades. Both relative and absolute paths work.
  data_dir: data
  # DuckDB file for ad-hoc queries (also rebuilt from parquet on demand).
  duckdb_path: data/trades.duckdb

analyzer:
  # Resampling grid for last-trade prices (in seconds). 1.0 is a sensible
  # default for spot-vs-spot crypto.
  resample_seconds: 1.0
  # Lag grid `numpy.arange(start, stop + step, step)` in seconds.
  lag_grid:
    start: -5.0
    stop: 5.0
    step: 0.1
  # Minimum overlapping seconds required before reporting a pair.
  min_obs: 600
  # Block-bootstrap parameters for confidence interval on the maximum lag.
  bootstrap:
    block_size: 30
    n_iter: 200

report:
  # Round-trip taker fee assumption used when computing the edge_bps proxy.
  taker_bps: 10.0
  # Output paths (relative to the repo root).
  markdown_path: reports/report.md
  json_path: reports/leaders.json
  # Drop pairs whose absolute correlation is below this threshold.
  min_abs_correlation: 0.4

dashboard:
  # Live terminal dashboard (`lead-lag-scanner dashboard`). Defaults are
  # *looser* than `analyzer.min_obs` and `report.min_abs_correlation` so the
  # dashboard surfaces preliminary signal a few minutes after collection
  # starts. Use `--strict` (or override here) to apply report-grade thresholds.
  refresh_seconds: 30
  top_k: 30
  # One of: edge_bps, abs_corr, n_obs, lag_abs.
  sort_by: edge_bps
  min_abs_correlation: 0.3
  min_obs: 60
  bootstrap_n_iter: 30
  # If true, hide pairs with leader == "none" (zero-lag, no directional edge).
  only_directional: false
